[profile.default]
# arc-foundry only applies Arc semantics when the network is selected explicitly, and no tool
# prints which EVM rules are in effect. Declared on the default profile so every other profile
# inherits it: upstream Foundry would run these tests against Ethereum rules and report a pass.
network = "arc"
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
# `network = "arc"` is what prices this chain — it applies EIP-7623's calldata floor, and the
# gas report reproduces a real receipt to the gas. This key cannot say so: the chain's baseline
# is Osaka and the toolchain resolves `osaka` to `prague`, so no value here is exactly true.
# `prague` is the closest one that is not false by two forks. Anyone running upstream forge
# against this repo, without the network key, gets numbers far too small.
evm_version = "prague"
gas_reports = ["*"]
# Read-only, one directory. The report interop test sends the same committed bytes the TypeScript
# encoder is checked against, so both implementations are pinned to one vector rather than to each
# other. Without this the cheatcode is sandboxed and the test cannot see the fixture.
fs_permissions = [{ access = "read", path = "../claim/fixtures" }]

[fmt]
tab_width = 2
multiline_func_header = "params_first"
sort_imports = true
single_line_statement_blocks = "preserve"
number_underscore = "thousands"
wrap_comments = true

[profile.ci]
fuzz = { runs = 10000 }
invariant = { runs = 512, depth = 128 }

[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC_URL}"
