[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
gas_reports = ["*"]

[fmt]
tab_width = 2
multiline_func_header = "params_first"
sort_imports = true
single_line_statement_blocks = "preserve"
number_underscore = "thousands"
wrap_comments = true

[profile.ci]
fuzz = { runs = 10000 }
invariant = { runs = 512, depth = 128 }

[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC_URL}"
