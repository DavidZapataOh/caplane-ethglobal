name: deploy

# Platform auto-deploy is off, so production is reached only from here. Several gates in this
# repository are proved by pushing a deliberately failing commit; with auto-deploy those land
# on a URL anyone can open.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_sha }}" }

      # `workflow_run.conclusion` is the whole workflow's, and two of its jobs must not block a
      # release: `credentialed` goes red when a third party has a bad minute, and
      # `data-sources` reports a missing secret on every push. Gating on the workflow would
      # mean never promoting. So the six hermetic jobs are checked by name.
      - name: Require the six hermetic jobs to have passed
        env:
          GH_TOKEN: "${{ github.token }}"
          RUN_ID: "${{ github.event.workflow_run.id }}"
        run: |
          jobs=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" --paginate \
                 --jq '.jobs[] | "\(.name)=\(.conclusion)"')
          echo "$jobs"
          failed=0
          # A matrix job is reported as `name (shard)`, never as a bare `name`, so an exact
          # match finds nothing and the gate refuses every promotion. Every shard has to be
          # green, not just the one that happens to come back first.
          for name in hygiene contracts claim libraries web workflow; do
            shards=$(printf '%s\n' "$jobs" | grep -E "^$name(=| \()" || true)
            if [ -z "$shards" ]; then
              echo "::error::$name did not run"
              failed=1
              continue
            fi
            bad=$(printf '%s\n' "$shards" | grep -v '=success$' || true)
            if [ -n "$bad" ]; then
              echo "::error::$name did not pass: $(printf '%s' "$bad" | tr '\n' ' ')"
              failed=1
            fi
          done
          exit $failed

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.2.21 }

      - name: Promote both surfaces
        env:
          VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}"
          VERCEL_ORG_ID: "${{ secrets.VERCEL_ORG_ID }}"
        run: |
          for project in web site; do
            (
              cd "$project"
              npx --yes vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
              npx --yes vercel build --prod --token "$VERCEL_TOKEN"
              npx --yes vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
            )
          done
