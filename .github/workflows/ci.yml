name: ci

on:
  push:
  pull_request:
  # Live third-party calls are metered. Running them on every push would let a Saturday of
  # pushes exhaust a sandbox quota and turn every other gate red for a reason we do not
  # control, so they run on a schedule and on demand instead.
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.2.21 }
      - run: bun install --frozen-lockfile
        working-directory: scripts/hygiene
      - run: bun test
        working-directory: scripts/hygiene
      - run: bun run scripts/hygiene/check.ts

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # NEVER foundry-rs/foundry-toolchain here. Circle's own README: it installs upstream
      # Foundry, "which has no Arc support and will run your tests against Ethereum rules
      # while reporting them as passing." Pin the Arc fork by checksum instead.
      - name: Install arc-foundry, pinned and checksum-verified
        run: |
          V=v0.8.0-1
          A=arc-foundry-$V-x86_64-unknown-linux-gnu.tar.gz
          curl -sSLO https://github.com/circlefin/arc-foundry/releases/download/$V/$A
          curl -sSLO https://github.com/circlefin/arc-foundry/releases/download/$V/$A.sha256
          sha256sum -c $A.sha256
          tar -xzf $A && mkdir -p "$HOME/.local/bin"
          mv forge "$HOME/.local/bin/arc-forge"
          mv cast  "$HOME/.local/bin/arc-cast"
          mv anvil "$HOME/.local/bin/arc-anvil"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      # The `network` key always exists; only its VALUE says whether Arc rules apply.
      # Grepping for the key name passes vacuously while tests run under Ethereum rules.
      - name: Confirm Arc semantics are the ones in effect
        working-directory: contracts
        env: { FOUNDRY_PROFILE: ci }
        run: |
          n=$(arc-forge config --json | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).network")
          echo "resolved network: $n"
          [ "$n" = "arc" ] || { echo "::error::EVM semantics are '$n', not 'arc'"; exit 1; }
      - run: arc-forge fmt --check
        working-directory: contracts
      - run: arc-forge lint
        working-directory: contracts
      # ChainConformance needs a fork, so it belongs to the credentialed tier, not here.
      - run: arc-forge test -vvv --no-match-contract ChainConformance
        working-directory: contracts
        env: { FOUNDRY_PROFILE: ci }
      # `forge test` exits 0 when it finds no tests at all, so a green job proves nothing
      # on its own. Assert the suite actually ran.
      - name: Assert the contract suite is not empty
        working-directory: contracts
        run: |
          n=$(arc-forge test --json --no-match-contract ChainConformance | node -e "
            let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
              const s=JSON.parse(d);
              console.log(Object.values(s).reduce((a,x)=>a+Object.keys(x.test_results||{}).length,0));
            })")
          echo "contract tests executed: $n"
          [ "$n" -gt 0 ] || { echo "::error::forge ran zero tests and still exited 0"; exit 1; }

  libraries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [contracts/abi, claim, sdk, brand, services/api, services/mcp, services/harness]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.dir }}
      - run: npm run typecheck
        working-directory: ${{ matrix.dir }}

  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [web, site]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.dir }}
      - run: npm run lint
        working-directory: ${{ matrix.dir }}
      - run: npm run build
        working-directory: ${{ matrix.dir }}

  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.2.21 }
      - run: bun install --frozen-lockfile
        working-directory: caplane-workflow
      - run: bun run typecheck
        working-directory: caplane-workflow
      # Hermetic: simulate and deploy need a login session and do not run in CI.
      # The vendored ABI copy in this directory is guarded by the hygiene job, which is the
      # only job that sees every tracked file regardless of package.

  data-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.2.21 }
      - run: bun install --frozen-lockfile
        working-directory: scripts/data-sources
      - run: bun run typecheck
        working-directory: scripts/data-sources
      - run: bun test
        working-directory: scripts/data-sources
      # Presence costs nothing and catches the real failure: nobody set the secret. It runs on
      # every push. Only the calls below are held back.
      - name: Assert every required secret is present
        env:
          LEDGER_APP_ID: ${{ secrets.LEDGER_APP_ID }}
          LEDGER_APP_PASSPHRASE: ${{ secrets.LEDGER_APP_PASSPHRASE }}
          WATCHLIST_SUBSCRIPTION: ${{ secrets.WATCHLIST_SUBSCRIPTION }}
          NOTIFY_TRANSPORT_KEY: ${{ secrets.NOTIFY_TRANSPORT_KEY }}
        run: |
          missing=0
          for name in LEDGER_APP_ID LEDGER_APP_PASSPHRASE WATCHLIST_SUBSCRIPTION NOTIFY_TRANSPORT_KEY; do
            if [ -z "${!name}" ]; then echo "::error::missing required secret: $name"; missing=1; fi
          done
          exit $missing
      - name: Providers still answer with the record we expect
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          LEDGER_APP_ID: ${{ secrets.LEDGER_APP_ID }}
          LEDGER_APP_PASSPHRASE: ${{ secrets.LEDGER_APP_PASSPHRASE }}
          WATCHLIST_SUBSCRIPTION: ${{ secrets.WATCHLIST_SUBSCRIPTION }}
        run: bun run scripts/data-sources/probe.ts

  credentialed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert every required secret is present
        env:
          ARC_TESTNET_RPC_URL: ${{ secrets.ARC_TESTNET_RPC_URL }}
        run: |
          missing=0
          for name in ARC_TESTNET_RPC_URL; do
            if [ -z "${!name}" ]; then echo "::error::missing required secret: $name"; missing=1; fi
          done
          exit $missing
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install arc-foundry, pinned and checksum-verified
        run: |
          V=v0.8.0-1
          A=arc-foundry-$V-x86_64-unknown-linux-gnu.tar.gz
          curl -sSLO https://github.com/circlefin/arc-foundry/releases/download/$V/$A
          curl -sSLO https://github.com/circlefin/arc-foundry/releases/download/$V/$A.sha256
          sha256sum -c $A.sha256
          tar -xzf $A && mkdir -p "$HOME/.local/bin" && mv forge "$HOME/.local/bin/arc-forge"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Endpoint liveness
        env: { ARC_TESTNET_RPC_URL: "${{ secrets.ARC_TESTNET_RPC_URL }}" }
        run: ./scripts/chain/liveness.sh
      - name: Frozen constants still match the live chain
        working-directory: contracts
        env: { ARC_TESTNET_RPC_URL: "${{ secrets.ARC_TESTNET_RPC_URL }}" }
        run: arc-forge test --match-contract ChainConformance --fork-url "$ARC_TESTNET_RPC_URL" -vvv

  clean-clone:
    runs-on: ubuntu-latest
    steps:
      - name: Clone fresh with no caches
        run: git clone --depth 1 "https://github.com/${{ github.repository }}" fresh
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.2.21 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install arc-foundry, pinned and checksum-verified
        run: |
          V=v0.8.0-1
          A=arc-foundry-$V-x86_64-unknown-linux-gnu.tar.gz
          curl -sSLO https://github.com/circlefin/arc-foundry/releases/download/$V/$A
          curl -sSLO https://github.com/circlefin/arc-foundry/releases/download/$V/$A.sha256
          sha256sum -c $A.sha256
          tar -xzf $A && mkdir -p "$HOME/.local/bin" && mv forge "$HOME/.local/bin/arc-forge"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - run: arc-forge build
        working-directory: fresh/contracts
      - run: bun install --frozen-lockfile && bun test
        working-directory: fresh/scripts/hygiene
