name: ci

on:
  push:
  pull_request:
  # Live third-party calls are metered. Running them on every push would let a Saturday of
  # pushes exhaust a sandbox quota and turn every other gate red for a reason we do not
  # control, so they run on a schedule and on demand instead.
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.2.21 }
      - run: bun install --frozen-lockfile
        working-directory: scripts/hygiene
      - run: bun test
        working-directory: scripts/hygiene
      - run: bun run scripts/hygiene/check.ts

  contracts:
    runs-on: ubuntu-latest
    # The suites that fork Arc, named once. This string has to match in three places below —
    # the test run, the not-empty guard and the gas gate — and three copies of it drifting
    # apart is how one of them ends up running a suite without the credentials it needs.
    env:
      NETWORKED: "ChainConformance|PoolTest|EscrowTest|MoneyInvariantsTest|FalsifiedTest"
    steps:
      - uses: actions/checkout@v4
      # NEVER foundry-rs/foundry-toolchain here. Circle's own README: it installs upstream
      # Foundry, "which has no Arc support and will run your tests against Ethereum rules
      # while reporting them as passing." Pin the Arc fork by checksum instead.
      - name: Install arc-foundry, pinned and checksum-verified
        run: |
          V=v0.8.0-1
          A=arc-foundry-$V-x86_64-unknown-linux-gnu.tar.gz
          curl -sSLO https://github.com/circlefin/arc-foundry/releases/download/$V/$A
          curl -sSLO https://github.com/circlefin/arc-foundry/releases/download/$V/$A.sha256
          sha256sum -c $A.sha256
          tar -xzf $A && mkdir -p "$HOME/.local/bin"
          mv forge "$HOME/.local/bin/arc-forge"
          mv cast  "$HOME/.local/bin/arc-cast"
          mv anvil "$HOME/.local/bin/arc-anvil"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - run: ./scripts/contracts/install-deps.sh
      # The `network` key always exists; only its VALUE says whether Arc rules apply.
      # Grepping for the key name passes vacuously while tests run under Ethereum rules.
      - name: Confirm Arc semantics are the ones in effect
        working-directory: contracts
        env: { FOUNDRY_PROFILE: ci }
        run: |
          n=$(arc-forge config --json | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).network")
          echo "resolved network: $n"
          [ "$n" = "arc" ] || { echo "::error::EVM semantics are '$n', not 'arc'"; exit 1; }
      - run: arc-forge fmt --check
        working-directory: contracts
      - run: arc-forge lint
        working-directory: contracts
      # ChainConformance and the suites that settle in real USDC need a fork of Arc, so they
      # belong to the credentialed tier, not here. Excluded by name: skipping them silently
      # would let the hermetic job go green while proving nothing about any of them. The list is
      # written once, in the job's env, because it has to match in all four places below.
      - run: arc-forge test -vvv --no-match-contract "$NETWORKED"
        working-directory: contracts
        env: { FOUNDRY_PROFILE: ci }
      # `forge test` exits 0 when it finds no tests at all, so a green job proves nothing
      # on its own. Assert the suite actually ran.
      - name: Assert the contract suite is not empty
        working-directory: contracts
        run: |
          n=$(arc-forge test --json --no-match-contract "$NETWORKED" | node -e "
            let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
              const s=JSON.parse(d);
              console.log(Object.values(s).reduce((a,x)=>a+Object.keys(x.test_results||{}).length,0));
            })")
          echo "contract tests executed: $n"
          [ "$n" -gt 0 ] || { echo "::error::forge ran zero tests and still exited 0"; exit 1; }
      # --isolate has to be on the check exactly as it was on the write: a snapshot taken one way
      # and checked the other exits 1 against untouched code, which is the failure mode that
      # gets a gate switched off within a week. Invariant lines stay out of the snapshot: their
      # line is (runs, calls, reverts), and --tolerance exits 1 against one byte-identical to
      # itself. Both verified, not assumed.
      - name: Gas has not regressed
        working-directory: contracts
        env: { FOUNDRY_PROFILE: ci }
        run: >-
          arc-forge snapshot --isolate --check --tolerance 2 --snap .gas-snapshot
          --no-match-contract "$NETWORKED" --no-match-test "^invariant_"

  libraries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [contracts/abi, claim, sdk, brand, services/api, services/mcp, services/harness]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.dir }}
      - run: npm run typecheck
        working-directory: ${{ matrix.dir }}
      # Conditional on purpose: a bare `npm test` across the matrix would fire the bun suites
      # in claim and sdk inside a job with no bun installed — red for an unrelated reason.
      - if: matrix.dir == 'brand'
        run: npm test
        working-directory: ${{ matrix.dir }}

  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [web, site]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.dir }}
      - run: npm run lint
        working-directory: ${{ matrix.dir }}
      - run: npm run build
        working-directory: ${{ matrix.dir }}

  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.2.21 }
      - run: bun install --frozen-lockfile
        working-directory: caplane-workflow
      - run: bun run typecheck
        working-directory: caplane-workflow
      # Hermetic: simulate and deploy need a login session and do not run in CI.
      # The vendored ABI copy in this directory is guarded by the hygiene job, which is the
      # only job that sees every tracked file regardless of package.

  data-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.2.21 }
      - run: bun install --frozen-lockfile
        working-directory: scripts/data-sources
      - run: bun run typecheck
        working-directory: scripts/data-sources
      - run: bun test
        working-directory: scripts/data-sources
      - run: bun install --frozen-lockfile
        working-directory: scripts/privy
      - run: bun run typecheck
        working-directory: scripts/privy
      - run: bun test
        working-directory: scripts/privy
      # Presence costs nothing and catches the real failure: nobody set the secret. It runs on
      # every push. Only the calls below are held back.
      - name: Assert every required secret is present
        env:
          LEDGER_APP_ID: ${{ secrets.LEDGER_APP_ID }}
          LEDGER_APP_PASSPHRASE: ${{ secrets.LEDGER_APP_PASSPHRASE }}
          WATCHLIST_SUBSCRIPTION: ${{ secrets.WATCHLIST_SUBSCRIPTION }}
          NOTIFY_TRANSPORT_KEY: ${{ secrets.NOTIFY_TRANSPORT_KEY }}
          NEXT_PUBLIC_PRIVY_PUBLIC_APP: ${{ secrets.NEXT_PUBLIC_PRIVY_PUBLIC_APP }}
          PRIVY_SERVER_CREDENTIAL: ${{ secrets.PRIVY_SERVER_CREDENTIAL }}
        run: |
          missing=0
          for name in LEDGER_APP_ID LEDGER_APP_PASSPHRASE WATCHLIST_SUBSCRIPTION NOTIFY_TRANSPORT_KEY \
                      NEXT_PUBLIC_PRIVY_PUBLIC_APP PRIVY_SERVER_CREDENTIAL; do
            if [ -z "${!name}" ]; then echo "::error::missing required secret: $name"; missing=1; fi
          done
          exit $missing
      - name: Providers still answer with the record we expect
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          LEDGER_APP_ID: ${{ secrets.LEDGER_APP_ID }}
          LEDGER_APP_PASSPHRASE: ${{ secrets.LEDGER_APP_PASSPHRASE }}
          WATCHLIST_SUBSCRIPTION: ${{ secrets.WATCHLIST_SUBSCRIPTION }}
        run: bun run scripts/data-sources/probe.ts
      # `--teardown` is not optional. A live run creates durable state, so without it every
      # scheduled run would leave an orphan wallet and policy behind in the dashboard.
      - name: Privy still denies what it should
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          NEXT_PUBLIC_PRIVY_PUBLIC_APP: ${{ secrets.NEXT_PUBLIC_PRIVY_PUBLIC_APP }}
          PRIVY_SERVER_CREDENTIAL: ${{ secrets.PRIVY_SERVER_CREDENTIAL }}
        run: bun run scripts/privy/deny.ts --teardown

  claim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.2.21 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # The enclave runtime is a 13 MB download. A cache with nothing to populate it is a
      # permanent miss, so the install step follows rather than replaces it.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/javy/v8.1.0
          key: javy-v8.1.0-${{ runner.os }}
      # javy publishes the digest bare, with no filename beside it, so `sha256sum -c` rejects
      # its own sidecar. Compare the digests directly, and refuse anything that is not one.
      - name: Install javy, pinned and checksum-verified
        run: |
          D="$HOME/.cache/javy/v8.1.0/linux-x64"
          if [ ! -x "$D/javy" ]; then
            mkdir -p "$D" && cd "$D"
            A=javy-x86_64-linux-v8.1.0.gz
            curl -fsSLO "https://github.com/bytecodealliance/javy/releases/download/v8.1.0/$A"
            curl -fsSLO "https://github.com/bytecodealliance/javy/releases/download/v8.1.0/$A.sha256"
            expected=$(tr -d '[:space:]' < "$A.sha256")
            actual=$(sha256sum "$A" | cut -d' ' -f1)
            if [ ${#expected} -ne 64 ] || [ "$expected" != "$actual" ]; then
              echo "::error::javy checksum mismatch: expected ${expected:-<empty>}, got $actual"
              exit 1
            fi
            gunzip -c "$A" > javy && chmod +x javy
          fi
          echo "$D" >> $GITHUB_PATH
      - run: npm ci
        working-directory: claim
      # The whole suite, not just the dual-runtime file: `libraries` only type-checks this
      # package, so anything else here would run on a developer's laptop and nowhere else.
      # The SDK's validator refuses what throws. This refuses what does not: a locale-aware
      # call returns different bytes in the two runtimes and raises nothing at all.
      - run: bun test
        working-directory: claim

  credentialed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert every required secret is present
        env:
          ARC_TESTNET_RPC_URL: ${{ secrets.ARC_TESTNET_RPC_URL }}
        run: |
          missing=0
          for name in ARC_TESTNET_RPC_URL; do
            if [ -z "${!name}" ]; then echo "::error::missing required secret: $name"; missing=1; fi
          done
          exit $missing
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install arc-foundry, pinned and checksum-verified
        run: |
          V=v0.8.0-1
          A=arc-foundry-$V-x86_64-unknown-linux-gnu.tar.gz
          curl -sSLO https://github.com/circlefin/arc-foundry/releases/download/$V/$A
          curl -sSLO https://github.com/circlefin/arc-foundry/releases/download/$V/$A.sha256
          sha256sum -c $A.sha256
          tar -xzf $A && mkdir -p "$HOME/.local/bin" && mv forge "$HOME/.local/bin/arc-forge"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - run: ./scripts/contracts/install-deps.sh
      - name: Endpoint liveness
        env: { ARC_TESTNET_RPC_URL: "${{ secrets.ARC_TESTNET_RPC_URL }}" }
        run: ./scripts/chain/liveness.sh
      - name: Frozen constants still match the live chain
        working-directory: contracts
        env: { ARC_TESTNET_RPC_URL: "${{ secrets.ARC_TESTNET_RPC_URL }}" }
        run: arc-forge test --match-contract ChainConformance --fork-url "$ARC_TESTNET_RPC_URL" -vvv
      - name: The pool and the escrow, against the USDC Arc actually runs
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: ci
          ARC_TESTNET_RPC_URL: "${{ secrets.ARC_TESTNET_RPC_URL }}"
          ARC_FORK_BLOCK: "${{ vars.ARC_FORK_BLOCK }}"
        run: arc-forge test --match-contract "PoolTest|EscrowTest|MoneyInvariantsTest|FalsifiedTest" -vvv
      - name: Gas has not regressed on the forked suites
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: ci
          ARC_TESTNET_RPC_URL: "${{ secrets.ARC_TESTNET_RPC_URL }}"
          ARC_FORK_BLOCK: "${{ vars.ARC_FORK_BLOCK }}"
        run: >-
          arc-forge snapshot --isolate --check --tolerance 2 --snap .gas-snapshot.fork
          --match-contract "PoolTest|EscrowTest"
      # Coverage needs the fork, so it belongs here. The invariant suites are excluded because
      # `coverage` runs them in full — thousands of sequenced calls inside a command that only
      # wanted to count branches — and never with --ir-minimum, which lowers the numbers by
      # itself: the registry reads 97.33% under it against 100% without, same code, same tests.
      - name: Branch coverage on the contracts
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: ci
          ARC_TESTNET_RPC_URL: "${{ secrets.ARC_TESTNET_RPC_URL }}"
        run: >-
          arc-forge coverage --report summary --exclude-tests
          --no-match-contract "RegistryInvariants|MoneyInvariants" | tee /tmp/coverage.txt
      - name: Refuse anything under 100% on src/
        working-directory: contracts
        run: |
          awk -F'|' '/src\/Caplane|src\/libraries/ {
            for (i = 3; i <= 5; i++) { gsub(/ /, "", $i) }
            if ($3 !~ /^100\.00%/ || $4 !~ /^100\.00%/ || $5 !~ /^100\.00%/) {
              gsub(/ /, "", $2); print "::error::uncovered in " $2 ": " $3 " " $4 " " $5; bad = 1
            }
            seen = 1
          } END { if (!seen) { print "::error::the coverage table named no contract at all"; exit 1 } exit bad }' /tmp/coverage.txt

  clean-clone:
    runs-on: ubuntu-latest
    steps:
      - name: Clone fresh with no caches
        run: git clone --depth 1 "https://github.com/${{ github.repository }}" fresh
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.2.21 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install arc-foundry, pinned and checksum-verified
        run: |
          V=v0.8.0-1
          A=arc-foundry-$V-x86_64-unknown-linux-gnu.tar.gz
          curl -sSLO https://github.com/circlefin/arc-foundry/releases/download/$V/$A
          curl -sSLO https://github.com/circlefin/arc-foundry/releases/download/$V/$A.sha256
          sha256sum -c $A.sha256
          tar -xzf $A && mkdir -p "$HOME/.local/bin" && mv forge "$HOME/.local/bin/arc-forge"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - run: ./scripts/contracts/install-deps.sh
        working-directory: fresh
      - run: arc-forge build
        working-directory: fresh/contracts
      - run: bun install --frozen-lockfile && bun test
        working-directory: fresh/scripts/hygiene
      # The web build is here because a warm machine cannot reproduce it: the linked brand
      # package resolves its own dependencies only if someone has installed them, and on a
      # developer's laptop someone always has.
      - run: npm ci && npm run build
        working-directory: fresh/web
