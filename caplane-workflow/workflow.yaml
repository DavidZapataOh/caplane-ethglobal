# ==========================================================================
# CRE WORKFLOW SETTINGS FILE
# ==========================================================================
staging-settings:
  user-workflow:
    # Deliberately not the production name. The owner is shared by every workflow in the
    # organization and the name is the only thing separating them, so a staging workflow under
    # the production name would write to the real registry. The price is that staging cannot
    # exercise onReport at all.
    workflow-name: "caplane-registry-staging"
    deployment-registry: "private"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.staging.json"
    secrets-path: "../secrets.yaml"

# ==========================================================================
production-settings:
  user-workflow:
    # Frozen in the deployed registry as an immutable: bytes10 of the first ten hex characters
    # of sha256("caplane-registry"), taken as ASCII. A workflow registered under any other name
    # produces reports onReport rejects for ever, and there is no setter.
    workflow-name: "caplane-registry"
    deployment-registry: "private"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.production.json"
    secrets-path: "../secrets.yaml"
