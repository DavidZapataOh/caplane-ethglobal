# ==========================================================================
# CRE SECRETS FILE
# ==========================================================================
# Maps the secret ID the workflow requests with `runtime.getSecrets([{ id }])`
# to the environment variable holding its value. References only — never values.
#
# The Vault DON releases these directly into the attested enclave; they are never
# exposed to node operators or to Workflow DON node memory.
#
# Naming rule: the id and the env var name must not be substrings of one another.
# The CLI fails to resolve overlapping names, so `SECRET_API_TOKEN` for id
# `API_TOKEN` is exactly the forbidden shape.
secretsNames:
    VAULT_ROUNDTRIP_PROBE:
        - CAPLANE_VAULT_PROBE_VALUE
    COMMITMENT_PEPPER:
        - CAPLANE_INDEX_SALT
