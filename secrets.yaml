# ==========================================================================
# CRE SECRETS FILE
# ==========================================================================
# Maps the secret ID the workflow requests with `runtime.getSecrets([{ id }])`
# to the environment variable holding its value. References only — never values.
#
# The Vault DON releases these directly into the attested enclave; they are never
# exposed to node operators or to Workflow DON node memory.
#
# There is no naming restriction between an id and its variable: measured against the CLI, an
# identical pair resolves. Three of these are the same on both sides for exactly that reason.
#
# Every entry here must have its variable exported before any simulation will start: the CLI
# resolves this whole file before reaching the handler and aborts on the first one it cannot find.
#
# One store, not one per target: the vault is keyed by owner and namespace, so uploading to a
# second target fails as a duplicate and every workflow under this owner reads these.
secretsNames:
    ENCLAVE_ENVELOPE_KEY:
        - CAPLANE_ENVELOPE_KEY
    COMMITMENT_PEPPER:
        - CAPLANE_INDEX_SALT
    LEDGER_APP_ID:
        - LEDGER_APP_ID
    LEDGER_APP_PASSPHRASE:
        - LEDGER_APP_PASSPHRASE
    WATCHLIST_SUBSCRIPTION:
        - WATCHLIST_SUBSCRIPTION
